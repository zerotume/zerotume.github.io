<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>03:14 — live player</title>
<style>
  :root { --bg:#07091a; --fg:#e8e6f4; --mute:#8a8fb0; --gold:#ffc857; }
  html,body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 Inter, system-ui, sans-serif; }
  #wrap { max-width: 1280px; margin: 0 auto; padding: 16px; }
  canvas { width:100%; aspect-ratio:16/9; background:#000; display:block; border-radius:8px; }
  #bar { display:flex; gap:12px; align-items:center; margin-top:10px; flex-wrap:wrap; }
  button { background:#1c2148; color:var(--fg); border:1px solid #2c3366; border-radius:6px; padding:6px 12px; cursor:pointer; }
  input[type=range] { flex:1; min-width:200px; accent-color: var(--gold); }
  #scenes { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  #scenes button.on { border-color: var(--gold); color: var(--gold); }
  .mono { font-family: "DejaVu Sans Mono", monospace; color: var(--mute); }
</style></head>
<body><div id="wrap">
  <canvas id="c" width="1920" height="1080"></canvas>
  <div id="bar"><button id="play">▶ play</button><input id="seek" type="range" min="0" max="246" step="0.01" value="0"><span id="time" class="mono">0:00.00</span>
    <label class="mono"><input type="checkbox" id="half" checked> half-res</label></div>
  <div id="scenes"></div>
  <p class="mono">Live render of the film's scene code. Audio: ../audio/out/score.wav. Serve the opus_new folder (python3 -m http.server) and open /src/index.html.</p>
</div>
<script type="module">
import { SCENES } from './film.js';
const mods = []; let start = 0;
for (const id of SCENES) { const m = (await import(`./scenes/${id}.js`)).default; mods.push({ id, m, start, dur: m.duration }); start += m.duration; }
const total = start;
const c = document.getElementById('c'), ctx = c.getContext('2d');
const seek = document.getElementById('seek'), timeEl = document.getElementById('time'), playBtn = document.getElementById('play'), half = document.getElementById('half');
seek.max = total;
const audio = new Audio('../audio/out/score.flac'); audio.preload = 'auto';
let playing = false, t = 0, last = 0;
const sc = document.getElementById('scenes');
mods.forEach(s => { const b = document.createElement('button'); b.textContent = `${s.id} · ${fmt(s.start)}`; b.onclick = () => setT(s.start + 0.01); s.btn = b; sc.appendChild(b); });
function fmt(x) { return `${Math.floor(x / 60)}:${(x % 60).toFixed(2).padStart(5, '0')}`; }
function setT(x) { t = Math.max(0, Math.min(total - 0.001, x)); audio.currentTime = t; draw(); }
function draw() {
  const s = mods.find(s => t >= s.start && t < s.start + s.dur) || mods[mods.length - 1];
  const W = half.checked ? 960 : 1920, H = half.checked ? 540 : 1080;
  if (c.width !== W) { c.width = W; c.height = H; }
  ctx.setTransform(W / 1920, 0, 0, H / 1080, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 1920, 1080);
  s.m.render(ctx, t - s.start, { frame: Math.round(t * 30), fps: 30, W, H });
  seek.value = t; timeEl.textContent = fmt(t);
  mods.forEach(m => m.btn.classList.toggle('on', m === s));
}
function loop(now) { if (playing) { t = audio.currentTime || (t + (now - last) / 1000); if (t >= total) { playing = false; playBtn.textContent = '▶ play'; } draw(); } last = now; requestAnimationFrame(loop); }
playBtn.onclick = () => { playing = !playing; playBtn.textContent = playing ? '❚❚ pause' : '▶ play'; if (playing) { audio.currentTime = t; audio.play().catch(() => {}); } else audio.pause(); };
seek.oninput = () => setT(+seek.value);
half.onchange = draw;
draw(); requestAnimationFrame(loop);
</script></body></html>
