<!doctype html>
<html><head><meta charset="utf-8"><title>render</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
// Headless render entry. URL params:
//   scene=<id>  w,h  fps  mode=video|stills  f0,f1 (frame range, inclusive-exclusive)  times=comma list  q=jpeg quality
const P = new URLSearchParams(location.search);
const post = (path, body) => fetch(path, { method: 'POST', body });
window.addEventListener('error', e => post('/error', String(e.message) + ' @' + e.filename + ':' + e.lineno));
window.addEventListener('unhandledrejection', e => post('/error', 'unhandled: ' + (e.reason && e.reason.stack || e.reason)));
try {
  const id = P.get('scene');
  const mod = await import(`./scenes/${id}.js`);
  const scene = mod.default;
  const W = +P.get('w') || 1920, H = +P.get('h') || 1080, fps = +P.get('fps') || 30;
  const c = document.getElementById('c'); c.width = W; c.height = H;
  const ctx = c.getContext('2d', { alpha: false });
  const q = +(P.get('q') || 0.95);
  if (scene.init) await scene.init();
  const blob = (type, qq) => new Promise(r => c.toBlob(r, type, qq));
  const frame = (t, f) => {
    ctx.setTransform(W / 1920, 0, 0, H / 1080, 0, 0);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 1920, 1080);
    scene.render(ctx, t, { frame: f, fps, W, H });
  };
  const mode = P.get('mode') || 'video';
  if (mode === 'video') {
    const f0 = +P.get('f0') || 0, f1 = +P.get('f1');
    let tR = 0, tE = 0;
    for (let f = f0; f < f1; f++) {
      const a = performance.now();
      frame(f / fps, f);
      const b = performance.now();
      const data = await blob('image/jpeg', q);
      tE += performance.now() - b; tR += b - a;
      await post('/frame?i=' + (f - f0), data);
      if ((f - f0) % 150 === 149) post('/log', `frame ${f} avg render ${(tR / (f - f0 + 1)).toFixed(0)}ms enc ${(tE / (f - f0 + 1)).toFixed(0)}ms`);
    }
  } else {
    const times = P.get('times').split(',').map(Number);
    for (let i = 0; i < times.length; i++) {
      frame(times[i], Math.round(times[i] * fps));
      await post('/frame?i=' + i, await blob('image/png'));
    }
  }
  await post('/done', 'ok');
} catch (e) {
  await post('/error', String(e && e.stack || e));
}
</script></body></html>
